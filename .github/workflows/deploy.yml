# Triggers a Vercel deployment on every push to main via the project's
# deploy hook. Needed because the Vercel project is owned by a different
# account than the commit author, so Vercel's built-in Git integration
# skips these pushes on the Hobby plan.
name: Deploy to Vercel

on:
  push:
    branches: [main]

jobs:
  trigger-vercel:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Vercel deploy hook
        run: curl -sf -X POST "$DEPLOY_HOOK" > /dev/null && echo "Deployment triggered"
        env:
          DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
